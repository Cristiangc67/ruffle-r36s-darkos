# =======================================================================
# UNIVERSAL CONTROLS TEMPLATE (For R36S / dArkOS)
# =======================================================================
# INSTRUCTIONS:
# 1. Rename this file to match EXACTLY the name of your game 
#    (e.g., if your game is "mario.swf", this file must be "mario.cfg").
# 2. Place this file inside the "keymap" folder.
# 3. Type the keyboard key you want to map after the "=" sign.
#
# IMPORTANT WARNING ABOUT UNMAPPED BUTTONS:
# If you leave a button blank or delete its line, the engine will NOT 
# disable it. Instead, it will force its default hardcoded profile 
# (e.g., assigning random keys like J or U). 
# If you want a button to do absolutely NOTHING, assign it to an 
# unused key (like Num9, V, or M) rather than leaving it blank.
# =======================================================================
#
# SUPPORTED KEYBOARD KEYS (What goes on the right side of the "="):
# - Letters: A, B, C, D... Z
# - Numbers: Num0, Num1... Num9
# - Arrows: Up, Down, Left, Right
# - Actions: Space, Return (this is the Enter key), Escape, Tab, Backspace
# - Special: F1 to F12, Delete, Insert, Home, End, PageUp, PageDown
#
# =======================================================================

# --- FACE BUTTONS ---
# (Note: On the R36S, the physical B -->A, the physical A-->B, the physical X-->Y and the physical Y --> X 
#  - test before finalizing).
A= 
B= 
X= 
Y= 

# --- SHOULDER BUTTONS / TRIGGERS ---
L= 
R= 
L2= 
R2= 

# --- SYSTEM & JOYSTICK BUTTONS ---
Start=
Select=
L3= 
R3= 

# =======================================================================
# NATIVE SYSTEM SHORTCUTS (Hardcoded in the engine, cannot be changed)
# =======================================================================
# - EXIT GAME: Hold Select and press Start.
# - MOUSE MODE: Hold Select and press X. 
#      (The D-Pad will move the cursor, and the Y button acts as Left Click).
#      (Press Select + X again to turn Mouse Mode off).
# - WASD MODE: Hold Select and press A (or B, depending on physical layout).
#      (Changes D-Pad behavior to W, A, S, D keys).
# =======================================================================